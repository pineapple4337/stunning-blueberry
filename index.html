<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense tracker</title>
    <!-- tailwind css cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* import inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        /* global font reset and lowercase enforcement */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            text-transform: lowercase !important;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main) !important;
            background-image: none !important;
            font-size: 0.95rem;
            letter-spacing: normal;
            line-height: 1.5;
        }

        h1, h2, h3, h4, h5, h6, button, input, select, textarea, option, span, p, td, th {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        /* modern category badges */
        .cat-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .cat-food { background-color: #fef2f2 !important; color: #991b1b !important; }
        .cat-shopping { background-color: #eef2ff !important; color: #3730a3 !important; }
        .cat-subscriptions { background-color: #f0f9ff !important; color: #075985 !important; }
        .cat-events { background-color: #f0fdf4 !important; color: #166534 !important; }
        .cat-fees { background-color: #fffbeb !important; color: #92400e !important; }
        .cat-health { background-color: #fdf2f8 !important; color: #9d174d !important; }
        .cat-transport { background-color: #ecfeff !important; color: #155e75 !important; }
        .cat-default { background-color: #f1f5f9 !important; color: #334155 !important; }

        /* modern bar fills */
        .bar-food { background-color: #ef4444 !important; }
        .bar-shopping { background-color: #6366f1 !important; }
        .bar-subscriptions { background-color: #0284c7 !important; }
        .bar-events { background-color: #22c55e !important; }
        .bar-fees { background-color: #f59e0b !important; }
        .bar-health { background-color: #ec4899 !important; }
        .bar-transport { background-color: #06b6d4 !important; }
        .bar-default { background-color: #3b82f6 !important; }

        /* card container */
        .glass-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05) !important;
            border-radius: 12px !important;
        }

        /* inputs & interactive elements */
        input, select, textarea {
            background-color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="glass-card sticky top-0 z-20 mx-4 mt-4">
        <div class="max-w-2xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">expense tracker</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3.5 py-1.5 bg-blue-50 text-blue-600 text-sm font-semibold rounded-lg">expenses</a>
                <a href="tasks.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">tasks</a>
                <a href="notes.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">notes</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 pt-6 space-y-6">

        <!-- MONTH NAVIGATION WITH TOTAL -->
        <div class="flex justify-between items-center glass-card p-4">
            <button id="prev-month-btn" class="px-3 py-1 hover:bg-slate-100 rounded-lg text-slate-600 font-semibold transition-colors cursor-pointer">←</button>
            <div class="flex items-center gap-3">
                <span id="current-month-display" class="text-lg font-bold text-slate-900">july 2026</span>
                <span id="month-total-pill" class="text-sm font-semibold bg-blue-50 text-blue-700 px-3 py-1 rounded-full">$0.00</span>
            </div>
            <button id="next-month-btn" class="px-3 py-1 hover:bg-slate-100 rounded-lg text-slate-600 font-semibold transition-colors cursor-pointer">→</button>
        </div>

        <!-- VISUAL STATS / CATEGORY BREAKDOWN -->
        <div class="glass-card p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider">monthly breakdown</h2>
                <button id="open-ledger-btn" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-all cursor-pointer">expand ledger ↗</button>
            </div>
            <div id="expense-visual-stats" class="space-y-3">
                <!-- Dynamic categories injected here -->
            </div>
        </div>

        <!-- ADD SINGLE EXPENSE FORM -->
        <div class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-semibold text-slate-500 tracking-wider">add single transaction</h2>
            <form id="expense-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="expense-desc" placeholder="description" required class="w-full px-3.5 py-2">
                    <input type="number" step="0.01" id="expense-amount" placeholder="amount ($)" required class="w-full px-3.5 py-2">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="expense-date" required class="w-full px-3.5 py-2">
                    <select id="expense-category" class="w-full px-3.5 py-2">
                        <option value="food & drink">food & drink</option>
                        <option value="shopping">shopping</option>
                        <option value="subscriptions">subscriptions</option>
                        <option value="events">events</option>
                        <option value="fees">fees</option>
                        <option value="health">health</option>
                        <option value="transport">transport</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">add expense</button>
            </form>
        </div>

        <!-- BULK JSON IMPORT CARD -->
        <div class="glass-card p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider">bulk transaction import</h2>
                <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">json mode</span>
            </div>
            
            <textarea id="json-text-input" rows="4" placeholder="paste json array here..." class="w-full px-3.5 py-2.5 font-mono text-xs"></textarea>

            <button id="import-json-btn" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-semibold rounded-lg transition-all cursor-pointer border border-slate-200">
                import entries
            </button>
        </div>

    </main>

    <!-- EXPANDED FULLSCREEN LEDGER MODAL -->
    <div id="expanded-ledger-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-2 sm:p-4 hidden">
        <div class="glass-card w-full max-w-3xl rounded-xl shadow-xl border border-slate-200 h-[92vh] sm:h-auto sm:max-h-[90vh] flex flex-col overflow-hidden bg-white">
            <div class="p-3.5 sm:p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-900">transaction ledger</h3>
                        <div class="flex items-center gap-2">
                            <p id="expanded-month-label" class="text-xs font-semibold text-slate-500">july 2026</p>
                            <span id="expanded-month-total" class="text-xs font-semibold bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">$0.00</span>
                        </div>
                    </div>
                    <select id="category-filter-select" class="px-2 py-1 text-xs font-semibold cursor-pointer">
                        <option value="all">all categories</option>
                        <option value="food & drink">food & drink</option>
                        <option value="shopping">shopping</option>
                        <option value="subscriptions">subscriptions</option>
                        <option value="events">events</option>
                        <option value="fees">fees</option>
                        <option value="health">health</option>
                        <option value="transport">transport</option>
                    </select>
                </div>
                <button id="close-ledger-btn" class="p-1.5 text-slate-400 hover:text-slate-700 font-bold rounded-lg transition-colors cursor-pointer text-lg">✕</button>
            </div>
            
            <div id="expanded-table-container" class="overflow-y-auto overflow-x-hidden flex-1">
                <!-- Dynamic table injected here -->
            </div>
            
            <div class="p-3 sm:p-4 border-t border-slate-200 bg-slate-50">
                <div id="expanded-visual-stats" class="grid grid-cols-2 md:grid-cols-3 gap-2 sm:gap-3">
                    <!-- Cloned stats injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT EXPENSE MODAL -->
    <div id="edit-expense-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md p-6 space-y-4 bg-white">
            <h3 class="text-base font-bold text-slate-900">edit expense</h3>
            <form id="edit-expense-form" class="space-y-3">
                <input type="hidden" id="edit-expense-id">
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">description</label>
                    <input type="text" id="edit-expense-desc" required class="w-full px-3.5 py-2">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">amount ($)</label>
                    <input type="number" step="0.01" id="edit-expense-amount" required class="w-full px-3.5 py-2">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">date</label>
                        <input type="date" id="edit-expense-date" required class="w-full px-3.5 py-2">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">category</label>
                        <select id="edit-expense-category" class="w-full px-3.5 py-2">
                            <option value="food & drink">food & drink</option>
                            <option value="shopping">shopping</option>
                            <option value="subscriptions">subscriptions</option>
                            <option value="events">events</option>
                            <option value="fees">fees</option>
                            <option value="health">health</option>
                            <option value="transport">transport</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-modal-btn" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition-all cursor-pointer">cancel</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, writeBatch, Timestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { APP_CONFIG } from './config.js';

        // --- FIREBASE INITIALIZATION ---
        const app = initializeApp(APP_CONFIG.FIREBASE_CONFIG);
        const db = getFirestore(app);
        const expensesCol = collection(db, 'expenses');

        // --- DOM HELPER ---
        const $ = (id) => document.getElementById(id);

        // --- GLOBAL STATE ---
        let globalExpensesCache = [];
        let displayDate = new Date();
        let selectedCategoryFilter = 'all';

        // --- CATEGORY STYLE CONFIGURATION ---
        const CATEGORY_STYLES = {
            'food & drink': { barClass: 'bar-food', badgeClass: 'cat-food' },
            'shopping': { barClass: 'bar-shopping', badgeClass: 'cat-shopping' },
            'subscriptions': { barClass: 'bar-subscriptions', badgeClass: 'cat-subscriptions' },
            'events': { barClass: 'bar-events', badgeClass: 'cat-events' },
            'fees': { barClass: 'bar-fees', badgeClass: 'cat-fees' },
            'health': { barClass: 'bar-health', badgeClass: 'cat-health' },
            'transport': { barClass: 'bar-transport', badgeClass: 'cat-transport' }
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initDefaultDate();
            setupEventListeners();
            fetchExpensesFromFirestore();
        });

        function initDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            if ($('expense-date'))$('expense-date').value = today;
            updateMonthDisplay();
        }

        function updateMonthDisplay() {
            const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            if ($('current-month-display')) {$('current-month-display').textContent = `${monthNames[displayDate.getMonth()]} ${displayDate.getFullYear()}`;
            }
        }

        function resetCategoryFilter() {
            selectedCategoryFilter = 'all';
            const select = $('category-filter-select');
            if (select) select.value = 'all';
        }

        function parseAmount(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            const cleaned = String(val).replace(/[^0-9.-]/g, '');
            const parsed = parseFloat(cleaned);
            return isNaN(parsed) ? 0 : parsed;
        }

        function parseEntryDate(dateVal) {
            if (!dateVal) return { year: null, month: null, displayStr: '01/01/1970', isoDate: '' };

            if (typeof dateVal === 'object' && dateVal.seconds !== undefined) {
                dateVal = new Date(dateVal.seconds * 1000).toISOString().split('T')[0];
            }

            let y, m, d;
            const str = String(dateVal).trim();

            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                    d = parts[0].padStart(2, '0');
                    m = parts[1].padStart(2, '0');
                    y = parts[2].length === 2 ? `20${parts[2]}` : parts[2];
                }
            } else if (str.includes('-')) {
                const cleanStr = str.split('T')[0];
                const parts = cleanStr.split('-');
                if (parts.length === 3) {
                    y = parts[0];
                    m = parts[1].padStart(2, '0');
                    d = parts[2].padStart(2, '0');
                }
            }

            if (y && m && d) {
                return {
                    year: parseInt(y, 10),
                    month: parseInt(m, 10),
                    isoDate: `${y}-${m}-${d}`,
                    displayStr: `${d}/${m}/${y}`
                };
            }

            return { year: null, month: null, displayStr: str, isoDate: str };
        }

        async function fetchExpensesFromFirestore() {
            try {
                const q = query(expensesCol, orderBy('date', 'desc'));
                const querySnapshot = await getDocs(q);

                globalExpensesCache = querySnapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));

                renderExpenses();
            } catch (err) {
                console.error("error fetching expenses from firestore:", err.message);
            }
        }

        function setupEventListeners() {
            $('expense-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newExpense = {
                    description: $('expense-desc').value.toLowerCase(),
                    amount: parseAmount($('expense-amount').value),
                    date: $('expense-date').value,
                    category: $('expense-category').value.toLowerCase()
                };

                try {
                    const docRef = await addDoc(expensesCol, newExpense);
                    globalExpensesCache.unshift({ id: docRef.id, ...newExpense });

                    renderExpenses();
                    $('expense-form').reset();
                    initDefaultDate();
                } catch (err) {
                    console.error("failed to add expense:", err.message);
                }
            });

            $('category-filter-select')?.addEventListener('change', (e) => {
                selectedCategoryFilter = e.target.value.toLowerCase();
                renderExpenses();
            });

            $('import-json-btn')?.addEventListener('click', async () => {
                let rawText = $('json-text-input')?.value?.trim();

                if (!rawText) {
                    alert('please paste text into the box first!');
                    return;
                }

                if (rawText.startsWith('```')) {
                    rawText = rawText.replace(/^```(json)?/i, '').replace(/```$/, '').trim();
                }

                try {
                    const parsed = JSON.parse(rawText);

                    if (!Array.isArray(parsed) || parsed.length === 0) {
                        alert('json must be a non-empty list/array of items.');
                        return;
                    }

                    const batch = writeBatch(db);

                    parsed.forEach(item => {
                        let date = item.date;
                        if (date && date.includes('/')) {
                            const [d, m, y] = date.split('/');
                            date = `${y.padStart(4, '20')}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                        }

                        const newDocRef = doc(expensesCol);
                        batch.set(newDocRef, {
                            date: date || new Date().toISOString().split('T')[0],
                            category: (item.category || 'shopping').toLowerCase().trim(),
                            amount: parseAmount(item.amount),
                            description: (item.description || 'expense').toLowerCase().trim()
                        });
                    });

                    await batch.commit();

                    alert(`successfully imported ${parsed.length} entries!`);
                    $('json-text-input').value = '';

                    await fetchExpensesFromFirestore();

                } catch (err) {
                    console.error("json import error:", err);
                    alert(`could not parse json. error: ${err.message}`);
                }
            });

            $('edit-expense-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $('edit-expense-id').value;
                const updatedFields = {
                    description: $('edit-expense-desc').value.toLowerCase(),
                    amount: parseAmount($('edit-expense-amount').value),
                    date: $('edit-expense-date').value,
                    category: $('edit-expense-category').value.toLowerCase()
                };

                try {
                    const docRef = doc(db, 'expenses', id);
                    await updateDoc(docRef, updatedFields);

                    const index = globalExpensesCache.findIndex(e => e.id == id);
                    if (index !== -1) {
                        globalExpensesCache[index] = { ...globalExpensesCache[index], ...updatedFields };
                    }

                    renderExpenses();
                    closeExpenseModal();
                } catch (err) {
                    console.error("failed to update expense:", err.message);
                }
            });

            $('prev-month-btn')?.addEventListener('click', () => {
                resetCategoryFilter();
                displayDate.setMonth(displayDate.getMonth() - 1);
                updateMonthDisplay();
                renderExpenses();
            });

            $('next-month-btn')?.addEventListener('click', () => {
                resetCategoryFilter();
                displayDate.setMonth(displayDate.getMonth() + 1);
                updateMonthDisplay();
                renderExpenses();
            });

            $('open-ledger-btn')?.addEventListener('click', () => toggleLedgerFullscreen());
            $('close-ledger-btn')?.addEventListener('click', () => toggleLedgerFullscreen());

            $('expanded-ledger-modal')?.addEventListener('click', (e) => {
                if (e.target === $('expanded-ledger-modal')) toggleLedgerFullscreen();
            });

            $('edit-expense-modal')?.addEventListener('click', (e) => {
                if (e.target === $('edit-expense-modal')) closeExpenseModal();
            });

            $('cancel-edit-modal-btn')?.addEventListener('click', () => closeExpenseModal());

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!$('expanded-ledger-modal')?.classList.contains('hidden')) {
                        toggleLedgerFullscreen();
                    }
                    closeExpenseModal();
                }
            });
        }

        function renderExpenses() {
            const stats = $('expense-visual-stats');
            if (!stats) return;

            stats.innerHTML = '';
            let totals = {}, totalAll = 0;

            Object.keys(CATEGORY_STYLES).forEach(k => totals[k] = 0);

            const selectedYear = displayDate.getFullYear();
            const selectedMonth = displayDate.getMonth() + 1;

            const active = globalExpensesCache.filter(e => {
                const parsed = parseEntryDate(e.date);
                const matchesMonth = parsed.year === selectedYear && parsed.month === selectedMonth;
                const matchesCat = selectedCategoryFilter === 'all' || 
                                   (e.category || '').toLowerCase() === selectedCategoryFilter.toLowerCase();
                return matchesMonth && matchesCat;
            });

            active.forEach(e => {
                const a = parseAmount(e.amount);
                totalAll += a;
                const cat = (e.category || '').toLowerCase();
                if (totals[cat] !== undefined) {
                    totals[cat] += a;
                }
            });

            if ($('month-total-pill')) {
                $('month-total-pill').textContent = `$${totalAll.toFixed(2)}`;
            }

            let hasEntries = false;

            Object.entries(totals).forEach(([cat, sum]) => {
                if (!sum) return;
                hasEntries = true;
                const pct = totalAll ? (sum / totalAll) * 100 : 0;
                const meta = CATEGORY_STYLES[cat] || { barClass: 'bar-default' };

                stats.appendChild(Object.assign(document.createElement('div'), {
                    className: "text-xs font-semibold",
                    innerHTML: `<div class="flex justify-between text-slate-700 items-center mb-1">
                        <span>${cat}</span>
                        <span class="text-slate-500">$${sum.toFixed(2)} (${Math.round(pct)}%)</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="${meta.barClass} h-full transition-all duration-300" style="width: ${pct}%"></div>
                    </div>`
                }));
            });

            if (!hasEntries) {
                stats.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">no expense data found</div>`;
            }

            if (!$('expanded-ledger-modal')?.classList.contains('hidden')) {
                renderExpandedLedger();
            }
        }

        function toggleLedgerFullscreen() {
            const modal = $('expanded-ledger-modal');
            if (!modal) return;

            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.remove('hidden');
                renderExpandedLedger();
            } else {
                modal.classList.add('hidden');
                resetCategoryFilter();
                renderExpenses();
            }
        }
        window.toggleLedgerFullscreen = toggleLedgerFullscreen;

        function renderExpandedLedger() {
            const tableContainer = $('expanded-table-container');
            const statsContainer = $('expanded-visual-stats');
            const monthLabel = $('expanded-month-label');
            const expandedTotal = $('expanded-month-total');
            if (!tableContainer || !statsContainer) return;

            const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
            if (monthLabel) monthLabel.textContent = `${monthNames[displayDate.getMonth()]} ${displayDate.getFullYear()}`;

            const selectedYear = displayDate.getFullYear();
            const selectedMonth = displayDate.getMonth() + 1;

            const active = globalExpensesCache.filter(e => {
                const parsed = parseEntryDate(e.date);
                const matchesMonth = parsed.year === selectedYear && parsed.month === selectedMonth;
                const matchesCat = selectedCategoryFilter === 'all' || 
                                   (e.category || '').toLowerCase() === selectedCategoryFilter.toLowerCase();
                return matchesMonth && matchesCat;
            });

            const totalAll = active.reduce((sum, e) => sum + parseAmount(e.amount), 0);
            if (expandedTotal) {
                expandedTotal.textContent = `$${totalAll.toFixed(2)}`;
            }

            statsContainer.innerHTML = $('expense-visual-stats')?.innerHTML || '';

            let tableHtml = `<table class="w-full table-fixed text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-50 sticky top-0 border-b border-slate-200 font-semibold text-slate-500 tracking-wider z-10">
                        <th class="p-2 sm:p-3 w-[22%] sm:w-28 sm:pl-5">date</th>
                        <th class="p-2 sm:p-3 w-[28%] sm:w-36">category</th>
                        <th class="p-2 sm:p-3 w-[28%] truncate">description</th>
                        <th class="p-2 sm:p-3 w-[22%] sm:w-32 text-right sm:pr-6">amount</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-700">`;

            if (active.length === 0) {
                tableHtml += `<tr><td colspan="4" class="p-8 text-center text-slate-400">no transactions found matching criteria</td></tr>`;
            } else {
                active.forEach(exp => {
                    const catKey = (exp.category || '').toLowerCase();
                    const meta = CATEGORY_STYLES[catKey] || { badgeClass: 'cat-default' };
                    const parsedDate = parseEntryDate(exp.date);
                    const amt = parseAmount(exp.amount);

                    tableHtml += `<tr onclick="window.openExpenseModal('${exp.id}')" class="hover:bg-slate-50 transition-colors group cursor-pointer">
                        <td class="p-2 sm:p-3 sm:pl-5 text-slate-500 truncate">${parsedDate.displayStr}</td>
                        <td class="p-2 sm:p-3"><span class="cat-badge ${meta.badgeClass}">${exp.category}</span></td>
                        <td class="p-2 sm:p-3 font-semibold text-slate-900 truncate">${exp.description}</td>
                        <td class="p-2 sm:p-3 text-right sm:pr-5 font-semibold text-slate-900">
                            <div class="flex items-center justify-end gap-1 sm:gap-2">
                                <span class="truncate">-$${amt.toFixed(2)}</span>
                                <button onclick="event.stopPropagation(); window.deleteExpense('${exp.id}')" class="text-slate-300 hover:text-red-500 font-bold p-1 cursor-pointer transition-colors opacity-100 sm:opacity-0 sm:group-hover:opacity-100">✕</button>
                            </div>
                        </td>
                    </tr>`;
                });
            }

            tableHtml += `</tbody></table>`;
            tableContainer.innerHTML = tableHtml;
        }

        window.deleteExpense = async function(id) {
            try {
                const docRef = doc(db, 'expenses', id);
                await deleteDoc(docRef);

                globalExpensesCache = globalExpensesCache.filter(e => e.id != id);
                renderExpenses();
            } catch (err) {
                console.error("failed to delete expense:", err.message);
            }
        };

        window.openExpenseModal = function(id) {
            const exp = globalExpensesCache.find(e => e.id == id);
            if (!exp) return;

            $('edit-expense-id').value = exp.id;
            $('edit-expense-desc').value = exp.description;
            $('edit-expense-amount').value = parseAmount(exp.amount);

            const parsed = parseEntryDate(exp.date);
            $('edit-expense-date').value = parsed.isoDate || exp.date;

            $('edit-expense-category').value = exp.category;

            $('edit-expense-modal').classList.remove('hidden');
        };

        window.closeExpenseModal = function() {
            $('edit-expense-modal')?.classList.add('hidden');
        };
    </script>
</body>
</html>
