<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-20">
        <div class="max-w-xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-base font-extrabold text-gray-900 tracking-tight lowercase">expense tracker</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-1.5 bg-purple-50 text-purple-600 text-xs font-bold rounded-xl lowercase">expenses</a>
                <a href="tasks.html" class="px-3 py-1.5 text-gray-400 hover:text-gray-600 text-xs font-bold rounded-xl transition-colors lowercase">tasks</a>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 pt-6 space-y-6">

        <!-- MONTH NAVIGATION WITH TOTAL -->
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-gray-100 shadow-xs">
            <button id="prev-month-btn" class="p-2 hover:bg-gray-50 rounded-xl text-gray-400 hover:text-gray-600 font-bold text-sm transition-colors cursor-pointer">←</button>
            <div class="flex items-center gap-2">
                <span id="current-month-display" class="text-sm font-extrabold text-gray-800 lowercase tracking-wide">july 2026</span>
                <span id="month-total-pill" class="text-xs font-bold bg-purple-50 text-purple-700 px-2.5 py-1 rounded-full font-mono">$0.00</span>
            </div>
            <button id="next-month-btn" class="p-2 hover:bg-gray-50 rounded-xl text-gray-400 hover:text-gray-600 font-bold text-sm transition-colors cursor-pointer">→</button>
        </div>

        <!-- VISUAL STATS / CATEGORY BREAKDOWN -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-xs space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black text-gray-400 lowercase tracking-wider">monthly breakdown</h2>
                <button id="open-ledger-btn" class="text-xs font-bold text-purple-600 hover:text-purple-700 bg-purple-50 hover:bg-purple-100 px-3 py-1.5 rounded-xl transition-all cursor-pointer lowercase">expand ledger ↗</button>
            </div>
            <div id="expense-visual-stats" class="space-y-3">
                <!-- Dynamic categories injected here -->
            </div>
        </div>

        <!-- ADD SINGLE EXPENSE FORM -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-xs space-y-4">
            <h2 class="text-xs font-black text-gray-400 lowercase tracking-wider">add single transaction</h2>
            <form id="expense-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="expense-desc" placeholder="description" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase">
                    <input type="number" step="0.01" id="expense-amount" placeholder="amount ($)" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="expense-date" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold text-gray-600">
                    <select id="expense-category" class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase text-gray-600">
                        <option value="food & drink">🍔 food & drink</option>
                        <option value="shopping">🛍️ shopping</option>
                        <option value="subscriptions">📺 subscriptions</option>
                        <option value="events">🎟️ events</option>
                        <option value="fees">💵 fees</option>
                        <option value="health">💊 health</option>
                        <option value="transport">🚌 transport</option>
                        <option value="utilities">⚡ utilities</option>
                        <option value="other">📦 other</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl transition-all cursor-pointer lowercase">add expense</button>
            </form>
        </div>

        <!-- BULK JSON IMPORT CARD -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-xs space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black text-gray-400 lowercase tracking-wider">bulk transaction import</h2>
                <span class="text-[10px] font-bold bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full lowercase">json mode</span>
            </div>
            
            <textarea id="json-text-input" rows="5" placeholder='paste gemini json here...' class="w-full px-4 py-3 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-mono text-gray-700 placeholder:text-gray-300"></textarea>

            <button id="import-json-btn" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl shadow-md transition-all cursor-pointer lowercase">
                import entries
            </button>
        </div>

    </main>

    <!-- EXPANDED FULLSCREEN LEDGER MODAL -->
    <div id="expanded-ledger-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl border border-gray-100 max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <div>
                    <h3 class="text-base font-extrabold text-gray-900 lowercase">transaction ledger</h3>
                    <div class="flex items-center gap-2 mt-0.5">
                        <p id="expanded-month-label" class="text-xs font-bold text-gray-400 lowercase">july 2026</p>
                        <span id="expanded-month-total" class="text-xs font-bold bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full font-mono">$0.00</span>
                    </div>
                </div>
                <button id="close-ledger-btn" class="p-2 text-gray-400 hover:text-gray-700 font-bold rounded-xl hover:bg-gray-100 transition-colors cursor-pointer text-sm">✕</button>
            </div>
            
            <div id="expanded-table-container" class="overflow-y-auto flex-1">
                <!-- Dynamic table injected here -->
            </div>
            
            <div class="p-6 border-t border-gray-100 bg-gray-50/30">
                <div id="expanded-visual-stats" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <!-- Cloned stats injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT EXPENSE MODAL -->
    <div id="edit-expense-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-gray-100 space-y-4">
            <h3 class="text-sm font-extrabold text-gray-900 lowercase">edit expense</h3>
            <form id="edit-expense-form" class="space-y-3">
                <input type="hidden" id="edit-expense-id">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">description</label>
                    <input type="text" id="edit-expense-desc" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">amount ($)</label>
                    <input type="number" step="0.01" id="edit-expense-amount" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">date</label>
                        <input type="date" id="edit-expense-date" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold text-gray-600">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">category</label>
                        <select id="edit-expense-category" class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-semibold lowercase text-gray-600">
                            <option value="food & drink">🍔 food & drink</option>
                            <option value="shopping">🛍️ shopping</option>
                            <option value="subscriptions">📺 subscriptions</option>
                            <option value="events">🎟️ events</option>
                            <option value="fees">💵 fees</option>
                            <option value="health">💊 health</option>
                            <option value="transport">🚌 transport</option>
                            <option value="utilities">⚡ utilities</option>
                            <option value="other">📦 other</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-modal-btn" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-xl transition-all cursor-pointer lowercase">cancel</button>
                    <button type="submit" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl transition-all cursor-pointer lowercase">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
