<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External Paper/Gaegu CSS Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="glass-card sticky top-0 z-20 mx-4 mt-4 rounded-2xl">
        <div class="max-w-xl mx-auto px-6 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight lowercase">expense tracker</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-1 pastel-purple-1 text-gray-800 text-sm font-bold rounded-xl lowercase">expenses</a>
                <a href="tasks.html" class="px-3 py-1 text-gray-500 hover:text-gray-800 text-sm font-bold rounded-xl transition-colors lowercase">tasks</a>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 pt-6 space-y-6">

        <!-- MONTH NAVIGATION WITH TOTAL -->
        <div class="flex justify-between items-center glass-card p-4 rounded-2xl">
            <button id="prev-month-btn" class="px-3 py-1 hover:bg-black/5 rounded-xl text-gray-600 font-bold text-base transition-colors cursor-pointer">←</button>
            <div class="flex items-center gap-2">
                <span id="current-month-display" class="text-base font-bold lowercase tracking-wide">july 2026</span>
                <span id="month-total-pill" class="text-sm font-bold pastel-purple-1 px-3 py-0.5 rounded-full">$0.00</span>
            </div>
            <button id="next-month-btn" class="px-3 py-1 hover:bg-black/5 rounded-xl text-gray-600 font-bold text-base transition-colors cursor-pointer">→</button>
        </div>

        <!-- VISUAL STATS / CATEGORY BREAKDOWN -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-500 lowercase tracking-wider">monthly breakdown</h2>
                <button id="open-ledger-btn" class="text-sm font-bold text-purple-900 pastel-purple-1 hover:brightness-95 px-3 py-1 rounded-xl transition-all cursor-pointer lowercase">expand ledger ↗</button>
            </div>
            <div id="expense-visual-stats" class="space-y-3">
                <!-- Dynamic categories injected here -->
            </div>
        </div>

        <!-- ADD SINGLE EXPENSE FORM -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h2 class="text-sm font-bold text-gray-500 lowercase tracking-wider">add single transaction</h2>
            <form id="expense-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="expense-desc" placeholder="description" required class="w-full px-4 py-2 text-sm font-semibold lowercase">
                    <input type="number" step="0.01" id="expense-amount" placeholder="amount ($)" required class="w-full px-4 py-2 text-sm font-semibold lowercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="expense-date" required class="w-full px-4 py-2 text-sm font-semibold">
                    <select id="expense-category" class="w-full px-4 py-2 text-sm font-semibold lowercase">
                        <option value="food & drink">🍔 food & drink</option>
                        <option value="shopping">🛍️ shopping</option>
                        <option value="subscriptions">📺 subscriptions</option>
                        <option value="events">🎟️ events</option>
                        <option value="fees">💵 fees</option>
                        <option value="health">💊 health</option>
                        <option value="transport">🚌 transport</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-gray-800 hover:bg-gray-900 text-white text-base font-bold rounded-xl transition-all cursor-pointer lowercase shadow-xs">add expense</button>
            </form>
        </div>

        <!-- BULK JSON IMPORT CARD -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-500 lowercase tracking-wider">bulk transaction import</h2>
                <span class="text-xs font-bold pastel-purple-1 px-2.5 py-0.5 rounded-full lowercase">json mode</span>
            </div>
            
            <textarea id="json-text-input" rows="4" placeholder='paste gemini json here...' class="w-full px-4 py-3 text-sm font-semibold placeholder:text-gray-400"></textarea>

            <button id="import-json-btn" class="w-full py-2.5 pastel-purple-1 hover:brightness-95 text-purple-900 text-base font-bold rounded-xl transition-all cursor-pointer lowercase border border-purple-200">
                import entries
            </button>
        </div>

    </main>

    <!-- EXPANDED FULLSCREEN LEDGER MODAL -->
    <div id="expanded-ledger-modal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-3xl rounded-3xl shadow-xl border-2 border-stone-200 max-h-[90vh] flex flex-col overflow-hidden bg-amber-50/90">
            <div class="p-5 border-b border-stone-200 flex justify-between items-center bg-white/50">
                <div class="flex items-center gap-3 flex-wrap">
                    <div>
                        <h3 class="text-lg font-bold lowercase">transaction ledger</h3>
                        <div class="flex items-center gap-2">
                            <p id="expanded-month-label" class="text-xs font-bold text-gray-500 lowercase">july 2026</p>
                            <span id="expanded-month-total" class="text-xs font-bold pastel-purple-1 px-2 py-0.5 rounded-full">$0.00</span>
                        </div>
                    </div>
                    <!-- CATEGORY FILTER SELECT -->
                    <select id="category-filter-select" class="px-3 py-1 text-xs lowercase font-bold cursor-pointer">
                        <option value="all">all categories</option>
                        <option value="food & drink">🍔 food & drink</option>
                        <option value="shopping">🛍️ shopping</option>
                        <option value="subscriptions">📺 subscriptions</option>
                        <option value="events">🎟️ events</option>
                        <option value="fees">💵 fees</option>
                        <option value="health">💊 health</option>
                        <option value="transport">🚌 transport</option>
                    </select>
                </div>
                <button id="close-ledger-btn" class="p-2 text-gray-500 hover:text-gray-800 font-bold rounded-xl transition-colors cursor-pointer text-base">✕</button>
            </div>
            
            <div id="expanded-table-container" class="overflow-y-auto flex-1">
                <!-- Dynamic table injected here -->
            </div>
            
            <div class="p-5 border-t border-stone-200 bg-white/40">
                <div id="expanded-visual-stats" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <!-- Cloned stats injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT EXPENSE MODAL -->
    <div id="edit-expense-modal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 space-y-4 bg-amber-50/95">
            <h3 class="text-base font-bold lowercase">edit expense</h3>
            <form id="edit-expense-form" class="space-y-3">
                <input type="hidden" id="edit-expense-id">
                <div>
                    <label class="text-xs font-bold text-gray-500 lowercase tracking-wider block mb-1">description</label>
                    <input type="text" id="edit-expense-desc" required class="w-full px-4 py-2 text-sm font-semibold lowercase">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500 lowercase tracking-wider block mb-1">amount ($)</label>
                    <input type="number" step="0.01" id="edit-expense-amount" required class="w-full px-4 py-2 text-sm font-semibold lowercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-gray-500 lowercase tracking-wider block mb-1">date</label>
                        <input type="date" id="edit-expense-date" required class="w-full px-4 py-2 text-sm font-semibold">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 lowercase tracking-wider block mb-1">category</label>
                        <select id="edit-expense-category" class="w-full px-4 py-2 text-sm font-semibold lowercase">
                            <option value="food & drink">🍔 food & drink</option>
                            <option value="shopping">🛍️ shopping</option>
                            <option value="subscriptions">📺 subscriptions</option>
                            <option value="events">🎟️ events</option>
                            <option value="fees">💵 fees</option>
                            <option value="health">💊 health</option>
                            <option value="transport">🚌 transport</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-modal-btn" class="flex-1 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-bold rounded-xl transition-all cursor-pointer lowercase">cancel</button>
                    <button type="submit" class="flex-1 py-2 pastel-purple-1 hover:brightness-95 text-purple-900 text-sm font-bold rounded-xl transition-all cursor-pointer lowercase border border-purple-200">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
