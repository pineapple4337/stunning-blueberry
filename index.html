<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense tracker</title>
    <!-- Tailwind CSS V4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans antialiased">

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
        
        <!-- HEADER / NAVIGATION -->
        <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl shadow-xs border border-gray-100">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-gray-900 lowercase">expense tracker 💸</h1>
                <p class="text-xs text-gray-400 font-medium lowercase">monthly overview & transaction ledger</p>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Task List Page Button -->
                <a href="tasks.html" class="px-4 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs font-bold rounded-2xl transition-all lowercase">
                    task list 📝
                </a>

                <!-- Month Selector -->
                <div class="flex items-center gap-3 bg-gray-50 p-1.5 rounded-2xl border border-gray-100">
                    <button id="prev-month-btn" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-2xs hover:bg-gray-100 transition-all cursor-pointer text-xs font-bold">←</button>
                    <span id="current-month-display" class="text-xs font-bold px-3 text-gray-700 lowercase"></span>
                    <button id="next-month-btn" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-2xs hover:bg-gray-100 transition-all cursor-pointer text-xs font-bold">→</button>
                </div>
            </div>
        </header>

        <!-- DASHBOARD GRID -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- LEFT / TOP: ADD EXPENSE & STATS -->
            <div class="space-y-6">
                <!-- Add Expense Card -->
                <div class="bg-white p-6 rounded-3xl shadow-xs border border-gray-100 space-y-4">
                    <h2 class="text-sm font-black text-gray-800 lowercase tracking-wider">add transaction</h2>
                    <form id="expense-form" class="space-y-3">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">description</label>
                            <input type="text" id="expense-desc" required placeholder="e.g. coffee / books" class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-medium lowercase">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">amount ($)</label>
                                <input type="number" step="0.01" id="expense-amount" required placeholder="0.00" class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-medium">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">date</label>
                                <input type="date" id="expense-date" required class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-medium">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">category</label>
                            <select id="expense-category" class="w-full px-4 py-2.5 text-xs bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-purple-500 font-medium lowercase">
                                <option value="food & drink">food & drink</option>
                                <option value="shopping">shopping</option>
                                <option value="subscriptions">subscriptions</option>
                                <option value="events">events</option>
                                <option value="fees">fees</option>
                                <option value="health">health</option>
                                <option value="transport">transport</option>
                                <option value="utilities">utilities</option>
                                <option value="other">other</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full py-3 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl shadow-md transition-all cursor-pointer lowercase">
                            add entry
                        </button>
                    </form>
                </div>

                <!-- Monthly Breakdown Visuals -->
                <div class="bg-white p-6 rounded-3xl shadow-xs border border-gray-100 space-y-4">
                    <h2 class="text-sm font-black text-gray-800 lowercase tracking-wider">monthly breakdown</h2>
                    <div id="expense-visual-stats" class="space-y-3.5">
                        <!-- Dynamic Progress Bars -->
                    </div>
                </div>
            </div>

            <!-- RIGHT / MAIN: CENTRALISED EXPAND BUTTON CARD -->
            <div class="lg:col-span-2 bg-white p-8 rounded-3xl shadow-xs border border-gray-100 flex flex-col items-center justify-center text-center space-y-4 min-h-[350px]">
                <div class="w-16 h-16 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-2xl shadow-3xs">
                    📊
                </div>
                <div>
                    <h2 class="text-lg font-black text-gray-800 lowercase tracking-tight">transaction ledger</h2>
                    <p class="text-xs text-gray-400 font-medium lowercase max-w-xs mt-1">open the expanded full-screen table to view, edit, or manage all entries for this month.</p>
                </div>
                <button id="open-ledger-btn" class="px-6 py-3.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-extrabold rounded-2xl shadow-md hover:shadow-lg active:scale-95 transition-all cursor-pointer lowercase tracking-wide flex items-center gap-2">
                    <span>open full transaction ledger</span> ⤢
                </button>
            </div>

        </div>
    </div>

    <!-- FULLSCREEN EXPANDED EXPENSE LEDGER MODAL -->
    <div id="expanded-ledger-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4 lg:p-8">
        <div class="bg-white rounded-3xl w-full max-w-6xl h-full max-h-[90vh] shadow-2xl border border-gray-100 flex flex-col overflow-hidden" onclick="event.stopPropagation()">
            
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-gray-50/50 shrink-0">
                <div class="flex items-center gap-3">
                    <h3 class="text-lg font-black text-gray-800 tracking-tight lowercase">transaction ledger 💰</h3>
                    <span id="expanded-month-label" class="px-3 py-1 text-xs font-bold rounded-full bg-purple-100 text-purple-700 lowercase"></span>
                </div>
                <button id="close-ledger-btn" class="px-4 py-2 text-xs font-bold bg-white hover:bg-gray-100 border border-gray-200 rounded-xl cursor-pointer text-gray-600 transition-all active:scale-95">
                    close view ✕
                </button>
            </div>

            <!-- Content Area -->
            <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">
                <!-- Left Side: Summary Stats -->
                <div class="w-full md:w-72 bg-gray-50/60 p-6 border-r border-gray-100 shrink-0 overflow-y-auto no-scrollbar">
                    <div class="text-[10px] font-bold text-gray-400 tracking-wider lowercase mb-4">monthly breakdown</div>
                    <div id="expanded-visual-stats" class="space-y-4"></div>
                </div>

                <!-- Right Side: Scrollable Table -->
                <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar p-6 bg-white" id="expanded-table-container">
                    <!-- Dynamic Table -->
                </div>
            </div>

        </div>
    </div>

    <!-- EDIT / VIEW TRANSACTION MODAL -->
    <div id="edit-expense-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-black text-sm lowercase">edit transaction</h3>
                <button id="close-edit-modal-btn" class="text-xs font-bold text-gray-400 hover:text-gray-600 cursor-pointer">✕</button>
            </div>
            <form id="edit-expense-form" class="space-y-3">
                <input type="hidden" id="edit-expense-id">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">description</label>
                    <input type="text" id="edit-expense-desc" required class="w-full px-4 py-2 text-xs bg-gray-50 rounded-xl border border-gray-200 font-medium lowercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">amount ($)</label>
                        <input type="number" step="0.01" id="edit-expense-amount" required class="w-full px-4 py-2 text-xs bg-gray-50 rounded-xl border border-gray-200 font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">date</label>
                        <input type="date" id="edit-expense-date" required class="w-full px-4 py-2 text-xs bg-gray-50 rounded-xl border border-gray-200 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 lowercase mb-1">category</label>
                    <select id="edit-expense-category" class="w-full px-4 py-2 text-xs bg-gray-50 rounded-xl border border-gray-200 font-medium lowercase">
                        <option value="food & drink">food & drink</option>
                        <option value="shopping">shopping</option>
                        <option value="subscriptions">subscriptions</option>
                        <option value="events">events</option>
                        <option value="fees">fees</option>
                        <option value="health">health</option>
                        <option value="transport">transport</option>
                        <option value="utilities">utilities</option>
                        <option value="other">other</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-modal-btn" class="flex-1 py-2.5 bg-gray-100 text-gray-600 text-xs font-bold rounded-xl cursor-pointer lowercase">cancel</button>
                    <button type="submit" class="flex-1 py-2.5 bg-purple-600 text-white text-xs font-bold rounded-xl cursor-pointer lowercase">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ES Module Script Import -->
    <script type="module" src="app.js"></script>
</body>
</html>
