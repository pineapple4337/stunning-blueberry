<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart notes</title>
    <!-- tailwind css cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- supabase js sdk -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            text-transform: lowercase !important;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main) !important;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .cat-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .cat-tag { background-color: #f1f5f9 !important; color: #334155 !important; }
        .cat-ai { background-color: #eef2ff !important; color: #3730a3 !important; }

        .glass-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
            border-radius: 12px !important;
        }

        input, select, textarea {
            background-color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="glass-card sticky top-0 z-20 mx-4 mt-4">
        <div class="max-w-2xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">smart notes</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">expenses</a>
                <a href="tasks.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">tasks</a>
                <a href="notes.html" class="px-3.5 py-1.5 bg-blue-50 text-blue-600 text-sm font-semibold rounded-lg">notes</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 pt-6 space-y-6">

        <!-- GEMINI API KEY INPUT CARD -->
        <div class="glass-card p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="cat-badge cat-ai">gemini ai</span>
                <span class="text-xs text-slate-500 font-medium">auto-summarize raw notes (optional)</span>
            </div>
            <input type="text" id="gemini-api-key" placeholder="paste gemini api key (optional)" autocomplete="off" class="px-3 py-1.5 w-full sm:w-64 text-xs">
        </div>

        <!-- ADD NOTE FORM -->
        <div class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-semibold text-slate-500 tracking-wider">quick capture</h2>
            <form id="note-form" class="space-y-3">
                <input type="text" id="note-title" placeholder="title or topic (optional)" class="w-full px-3.5 py-2">
                <textarea id="note-content" rows="4" placeholder="dump raw thoughts, use #hashtags for tags, or bullet points..." required class="w-full px-3.5 py-2.5 text-sm"></textarea>
                <button type="submit" id="save-note-btn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">
                    <span>save note</span>
                </button>
            </form>
        </div>

        <!-- MERGE TOOLBAR -->
        <div id="merge-toolbar" class="glass-card p-4 flex justify-between items-center bg-blue-50/50 border-blue-200 hidden">
            <div class="flex items-center gap-2">
                <span id="selected-count" class="text-xs font-bold text-blue-900">0 notes selected</span>
            </div>
            <div class="flex gap-2">
                <button id="cancel-selection-btn" onclick="window.clearSelection()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg cursor-pointer">
                    cancel
                </button>
                <button id="merge-notes-btn" onclick="window.mergeSelectedNotes()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg cursor-pointer">
                    merge selected
                </button>
            </div>
        </div>

        <!-- NOTES LIST -->
        <div class="glass-card p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider">saved notes</h2>
                <span id="note-count-badge" class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">0 notes</span>
            </div>
            
            <div id="notes-list" class="space-y-4">
                <p class="py-6 text-center text-xs text-slate-400">loading notes...</p>
            </div>
        </div>

    </main>

    <!-- EDIT NOTE MODAL -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="if(event.target === this) window.closeEditModal()">
        <div class="glass-card max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider">edit note</h2>
                <button onclick="window.closeEditModal()" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>
            <form id="edit-note-form" class="space-y-3">
                <input type="hidden" id="edit-note-id">
                <input type="text" id="edit-note-title" placeholder="title or topic" class="w-full px-3.5 py-2">
                <textarea id="edit-note-content" rows="6" required class="w-full px-3.5 py-2.5 text-sm"></textarea>
                
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="re-summarize-check" class="w-3.5 h-3.5 rounded border-slate-300 text-blue-600">
                    <label for="re-summarize-check" class="text-xs text-slate-500 font-medium cursor-pointer">regenerate ai summary on update (uses api tokens)</label>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="window.closeEditModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">
                        cancel
                    </button>
                    <button type="submit" id="update-note-btn" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg">
                        update note
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { APP_CONFIG } from './config.js';

        const supabase = window.supabase?.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
        const $ = (id) => document.getElementById(id);

        let globalNotesCache = [];
        let selectedNoteIds = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchNotes();
            
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey && $('gemini-api-key')) {
                $('gemini-api-key').value = savedKey;
            }
        });

        function setupEventListeners() {
            $('gemini-api-key')?.addEventListener('input', (e) => {
                localStorage.setItem('gemini_key', e.target.value.trim());
            });

            // Create Note Form
            $('note-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const titleInput = $('note-title');
                const contentInput = $('note-content');
                const saveBtn = $('save-note-btn');

                const rawContent = contentInput.value.trim().toLowerCase();
                const userTitle = titleInput.value.trim().toLowerCase();

                if (!rawContent) return;

                saveBtn.disabled = true;
                saveBtn.innerHTML = `<span>processing...</span>`;

                try {
                    const aiResult = await processNoteContent(rawContent, userTitle, true);

                    const newNoteObj = {
                        title: aiResult.title || userTitle || 'untitled note',
                        raw_content: rawContent,
                        summary: aiResult.summary,
                        tags: aiResult.tags || []
                    };

                    const { data, error } = await supabase
                        .from('notes')
                        .insert([newNoteObj])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        globalNotesCache.unshift(data[0]);
                    }

                    titleInput.value = '';
                    contentInput.value = '';
                    renderNotes();
                } catch (err) {
                    console.error('error saving note:', err.message);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = `<span>save note</span>`;
                }
            });

            // Update Note Form
            $('edit-note-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $('edit-note-id').value;
                const title = $('edit-note-title').value.trim().toLowerCase();
                const content = $('edit-note-content').value.trim().toLowerCase();
                const shouldResummarize = $('re-summarize-check')?.checked || false;
                const updateBtn = $('update-note-btn');

                if (!content || !id) return;

                updateBtn.disabled = true;
                updateBtn.innerText = 'updating...';

                try {
                    const existingNote = globalNotesCache.find(n => String(n.id) === String(id));
                    const aiResult = await processNoteContent(content, title, shouldResummarize);

                    const updatedFields = {
                        title: aiResult.title || title || 'untitled note',
                        raw_content: content,
                        summary: shouldResummarize ? aiResult.summary : (existingNote?.summary || aiResult.summary),
                        tags: aiResult.tags || []
                    };

                    const { error } = await supabase
                        .from('notes')
                        .update(updatedFields)
                        .eq('id', id);

                    if (error) throw error;

                    const index = globalNotesCache.findIndex(n => String(n.id) === String(id));
                    if (index !== -1) {
                        globalNotesCache[index] = { ...globalNotesCache[index], ...updatedFields };
                    }

                    window.closeEditModal();
                    renderNotes();
                } catch (err) {
                    console.error('error updating note:', err.message);
                } finally {
                    updateBtn.disabled = false;
                    updateBtn.innerText = 'update note';
                }
            });
        }

        // --- SMART PARSING ---
        async function processNoteContent(content, userTitle, allowAi = true) {
            const apiKey = $('gemini-api-key')?.value?.trim() || APP_CONFIG.GEMINI_API_KEY || '';
        
            if (apiKey && allowAi) {
                try {
                    const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
                    
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey
                        },
                        body: JSON.stringify({
                            // System instruction sets the behavior once
                            systemInstruction: {
                                parts: [{ text: "Extract facts in UK English. Max 10-word summary. Direct facts only. No meta-talk like 'this note...'." }]
                            },
                            contents: [{ 
                                // Minimal prompt payload
                                parts: [{ text: content }] 
                            }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        title: { type: "STRING" },
                                        summary: { type: "STRING" },
                                        tags: { type: "ARRAY", items: { type: "STRING" } }
                                    },
                                    required: ["title", "summary", "tags"]
                                }
                            }
                        })
                    });
        
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Gemini API Error details:', errorText);
                        throw new Error(`API returned HTTP ${response.status}`);
                    }
        
                    const data = await response.json();
                    const textResult = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
                    const parsed = typeof textResult === 'string' ? JSON.parse(textResult) : textResult;
        
                    return {
                        title: userTitle || parsed.title || 'quick note',
                        summary: parsed.summary || content.slice(0, 100),
                        tags: parsed.tags || []
                    };
                } catch (err) {
                    console.warn('AI request failed, falling back to local parsing:', err);
                }
            }
        
            // Local fallback parsing
            const hashtagRegex = /#(\w+)/g;
            const extractedTags = [];
            let match;
            while ((match = hashtagRegex.exec(content)) !== null) {
                extractedTags.push(match[1].toLowerCase());
            }
        
            const cleanLines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const fallbackTitle = userTitle || (cleanLines[0] ? cleanLines[0].replace(/^#*\s*/, '').slice(0, 35) : 'untitled note');
            const localSummary = cleanLines.join(' ').slice(0, 120) + (content.length > 120 ? '...' : '');
        
            return {
                title: fallbackTitle,
                summary: localSummary,
                tags: extractedTags.length > 0 ? Array.from(new Set(extractedTags)) : ['quick-note']
            };
        }

        // --- FETCH NOTES ---
        async function fetchNotes() {
            const list = $('notes-list');
            if (!list) return;

            try {
                const { data: notes, error } = await supabase
                    .from('notes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                globalNotesCache = notes || [];
                renderNotes();
            } catch (err) {
                console.error('failed to fetch notes:', err.message);
                list.innerHTML = `<p class="py-6 text-center text-xs text-slate-400">error loading notes</p>`;
            }
        }

        // --- RENDER NOTES ---
        function renderNotes() {
            const list = $('notes-list');
            const badge = $('note-count-badge');
            if (!list) return;

            if (badge) badge.textContent = `${globalNotesCache.length} notes`;

            if (globalNotesCache.length === 0) {
                list.innerHTML = `<p class="py-6 text-center text-xs text-slate-400">no notes saved yet</p>`;
                return;
            }

            list.innerHTML = globalNotesCache.map(note => {
                const dateObj = new Date(note.created_at || Date.now());
                const formattedDate = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                
                const isChecked = selectedNoteIds.has(String(note.id));
                const tagsHtml = (note.tags || []).map(t => `<span class="cat-badge cat-tag mr-1">#${t}</span>`).join('');
                const wordCount = note.raw_content.trim().split(/\s+/).length;
                const readTime = Math.max(1, Math.ceil(wordCount / 200));

                return `
                    <div onclick="window.openEditModal('${note.id}')" 
                        class="border border-slate-100 rounded-lg p-4 space-y-2 hover:border-slate-300 transition-all group relative bg-slate-50/50 cursor-pointer hover:shadow-sm">
                        <div class="flex justify-between items-start gap-3">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                    onclick="event.stopPropagation()"
                                    onchange="window.toggleSelectNote('${note.id}')"
                                    class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer shrink-0">
                                <h3 class="text-sm font-bold text-slate-900 truncate">${note.title}</h3>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="text-[11px] text-slate-400 font-medium mr-1">${formattedDate} • ${readTime} min read</span>
                                <button onclick="event.stopPropagation(); window.deleteNote('${note.id}')" class="text-slate-300 hover:text-red-500 text-xs font-bold p-1 cursor-pointer transition-colors" title="delete note">
                                    ✕
                                </button>
                            </div>
                        </div>

                        ${note.summary ? `<div class="p-2.5 bg-blue-50/60 rounded-md text-xs font-medium text-slate-700 border border-blue-100/50">
                            <span class="font-bold text-blue-700 block mb-0.5">summary</span>
                            ${note.summary}
                        </div>` : ''}

                        <p class="text-xs text-slate-500 font-normal whitespace-pre-wrap leading-relaxed">${note.raw_content}</p>

                        <div class="pt-1 flex items-center justify-between">
                            <div>${tagsHtml}</div>
                            <span class="text-[10px] text-slate-400 font-semibold">${wordCount} words</span>
                        </div>
                    </div>
                `;
            }).join('');

            updateMergeToolbar();
        }

        // --- EDIT MODAL HANDLERS ---
        window.openEditModal = function(id) {
            const note = globalNotesCache.find(n => String(n.id) === String(id));
            if (!note) return;

            $('edit-note-id').value = note.id;
            $('edit-note-title').value = note.title || '';
            $('edit-note-content').value = note.raw_content || '';
            if ($('re-summarize-check')) $('re-summarize-check').checked = false;
            $('edit-modal')?.classList.remove('hidden');
        };

        window.closeEditModal = function() {
            $('edit-modal')?.classList.add('hidden');
        };

        // --- SELECTION & MERGE HANDLERS ---
        window.toggleSelectNote = function(id) {
            const strId = String(id);
            if (selectedNoteIds.has(strId)) {
                selectedNoteIds.delete(strId);
            } else {
                selectedNoteIds.add(strId);
            }
            updateMergeToolbar();
        };

        window.clearSelection = function() {
            selectedNoteIds.clear();
            renderNotes();
        };

        function updateMergeToolbar() {
            const toolbar = $('merge-toolbar');
            const countText = $('selected-count');
            
            if (selectedNoteIds.size > 0) {
                toolbar?.classList.remove('hidden');
                if (countText) countText.textContent = `${selectedNoteIds.size} notes selected`;
            } else {
                toolbar?.classList.add('hidden');
            }
        }

        window.mergeSelectedNotes = async function() {
            if (selectedNoteIds.size < 2) {
                alert('select at least 2 notes to merge.');
                return;
            }

            const notesToMerge = globalNotesCache.filter(n => selectedNoteIds.has(String(n.id)));
            const mergedContent = notesToMerge.map(n => `--- ${n.title} ---\n${n.raw_content}`).join('\n\n');
            const mergedTitle = `merged: ${notesToMerge[0].title} + ${notesToMerge.length - 1} more`;

            try {
                const aiResult = await processNoteContent(mergedContent, mergedTitle, true);

                const newMergedObj = {
                    title: mergedTitle,
                    raw_content: mergedContent,
                    summary: aiResult.summary,
                    tags: Array.from(new Set(notesToMerge.flatMap(n => n.tags || [])))
                };

                const { data, error } = await supabase
                    .from('notes')
                    .insert([newMergedObj])
                    .select();

                if (error) throw error;

                const idsToDelete = Array.from(selectedNoteIds);
                await supabase.from('notes').delete().in('id', idsToDelete);

                globalNotesCache = globalNotesCache.filter(n => !selectedNoteIds.has(String(n.id)));
                if (data && data.length > 0) {
                    globalNotesCache.unshift(data[0]);
                }

                selectedNoteIds.clear();
                renderNotes();
            } catch (err) {
                console.error('failed to merge notes:', err.message);
            }
        };

        // --- DELETE HANDLER ---
        window.deleteNote = async function(id) {
            try {
                const { error } = await supabase.from('notes').delete().eq('id', id);
                if (error) throw error;

                globalNotesCache = globalNotesCache.filter(n => String(n.id) !== String(id));
                selectedNoteIds.delete(String(id));
                renderNotes();
            } catch (err) {
                console.error('failed to delete note:', err.message);
            }
        };
    </script>
</body>
</html>
