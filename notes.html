<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart notes</title>
    <!-- tailwind css cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* import inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        /* global font reset and lowercase enforcement */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            text-transform: lowercase !important;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main) !important;
            background-image: none !important;
            font-size: 0.95rem;
            letter-spacing: normal;
            line-height: 1.5;
        }

        h1, h2, h3, h4, h5, h6, button, input, select, textarea, option, span, p, td, th {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        .glass-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05) !important;
            border-radius: 12px !important;
        }

        input, select, textarea {
            background-color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.7rem;
            font-weight: 600;
            background-color: #f1f5f9;
            color: #475569;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="glass-card sticky top-0 z-20 mx-4 mt-4">
        <div class="max-w-2xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">smart notes</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">expenses</a>
                <a href="tasks.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">tasks</a>
                <a href="notes.html" class="px-3.5 py-1.5 bg-blue-50 text-blue-600 text-sm font-semibold rounded-lg">notes</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 pt-6 space-y-6">

        <!-- GEMINI API KEY SETUP -->
        <div class="glass-card p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex-1 w-full">
                <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">gemini api key (optional for smart summaries)</label>
                <input type="password" id="gemini-api-key-input" placeholder="paste api key here..." class="w-full px-3 py-1.5 text-xs">
            </div>
            <button id="save-api-key-btn" class="w-full sm:w-auto px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded-lg transition-all cursor-pointer self-end">
                save key
            </button>
        </div>

        <!-- QUICK CAPTURE FORM -->
        <div class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-semibold text-slate-500 tracking-wider">quick capture note</h2>
            <form id="note-form" class="space-y-3">
                <input type="text" id="note-title" placeholder="title or main topic (optional)" class="w-full px-3.5 py-2">
                <textarea id="note-content" rows="4" placeholder="dump raw thoughts, meeting notes, ideas..." required class="w-full px-3.5 py-2.5"></textarea>
                <button type="submit" id="save-note-btn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer flex items-center justify-center gap-2">
                    <span>process & save note</span>
                </button>
            </form>
        </div>

        <!-- MERGE TOOLBAR (Hidden by default) -->
        <div id="merge-toolbar" class="glass-card p-4 flex justify-between items-center hidden bg-blue-50/50 border-blue-200">
            <span id="selected-count-text" class="text-xs font-semibold text-blue-900">0 notes selected</span>
            <div class="flex gap-2">
                <button id="cancel-selection-btn" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors cursor-pointer">cancel</button>
                <button id="merge-selected-btn" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition-colors cursor-pointer">merge notes</button>
            </div>
        </div>

        <!-- SAVED NOTES LIST -->
        <div class="glass-card p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider">saved notes</h2>
                <span id="notes-total-count" class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">0 notes</span>
            </div>

            <div id="notes-list" class="space-y-4">
                <div class="py-8 text-center text-xs text-slate-400">loading notes...</div>
            </div>
        </div>

    </main>

    <!-- EDIT NOTE MODAL -->
    <div id="edit-note-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-lg p-6 space-y-4 bg-white">
            <h3 class="text-base font-bold text-slate-900">edit note</h3>
            <form id="edit-note-form" class="space-y-3">
                <input type="hidden" id="edit-note-id">
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">title</label>
                    <input type="text" id="edit-note-title" class="w-full px-3.5 py-2">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">raw content</label>
                    <textarea id="edit-note-content" rows="6" required class="w-full px-3.5 py-2.5"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="edit-regenerate-ai" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    <label for="edit-regenerate-ai" class="text-xs font-semibold text-slate-600 cursor-pointer">regenerate ai summary & tags on save</label>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-modal-btn" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition-all cursor-pointer">cancel</button>
                    <button type="submit" id="save-edit-modal-btn" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { APP_CONFIG } from './config.js';

        // --- FIREBASE INITIALIZATION ---
        const app = initializeApp(APP_CONFIG.FIREBASE_CONFIG);
        const db = getFirestore(app);
        const notesRef = collection(db, 'notes');

        // --- DOM HELPER ---
        const $ = (id) => document.getElementById(id);

        // --- GLOBAL STATE ---
        let globalNotesCache = [];
        let selectedNoteIds = new Set();

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadStoredApiKey();
            setupEventListeners();
            fetchNotes();
        });

        function loadStoredApiKey() {
            const key = localStorage.getItem('gemini_key') || '';
            if ($('gemini-api-key-input'))$('gemini-api-key-input').value = key;
        }

        function setupEventListeners() {
            $('save-api-key-btn')?.addEventListener('click', () => {
                const key = $('gemini-api-key-input')?.value?.trim() || '';
                localStorage.setItem('gemini_key', key);
                alert(key ? 'gemini api key saved locally.' : 'gemini api key cleared.');
            });

            $('note-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const titleInput = $('note-title')?.value?.trim() || '';
                const rawContent = $('note-content')?.value?.trim() || '';
                if (!rawContent) return;

                const submitBtn = $('save-note-btn');
                if (submitBtn) submitBtn.disabled = true;

                try {
                    const processed = await processNoteWithAI(titleInput, rawContent);
                    const newNote = {
                        title: processed.title,
                        raw_content: rawContent,
                        summary: processed.summary,
                        tags: processed.tags,
                        created_at: serverTimestamp()
                    };

                    const docRef = await addDoc(notesRef, newNote);
                    
                    globalNotesCache.unshift({
                        id: docRef.id,
                        ...newNote,
                        created_at: new Date()
                    });

                    $('note-form').reset();
                    renderNotes();
                } catch (err) {
                    console.error('failed to save note:', err.message);
                    alert('error saving note: ' + err.message);
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });

            $('edit-note-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $('edit-note-id').value;
                const titleInput = $('edit-note-title').value.trim();
                const rawContent = $('edit-note-content').value.trim();
                const shouldRegenerate = $('edit-regenerate-ai').checked;

                if (!rawContent || !id) return;

                const submitBtn = $('save-edit-modal-btn');
                if (submitBtn) submitBtn.disabled = true;

                try {
                    let updatedFields = {
                        title: titleInput,
                        raw_content: rawContent
                    };

                    if (shouldRegenerate) {
                        const processed = await processNoteWithAI(titleInput, rawContent);
                        updatedFields.title = processed.title;
                        updatedFields.summary = processed.summary;
                        updatedFields.tags = processed.tags;
                    }

                    await updateDoc(doc(db, 'notes', id), updatedFields);

                    const index = globalNotesCache.findIndex(n => n.id === id);
                    if (index !== -1) {
                        globalNotesCache[index] = { ...globalNotesCache[index], ...updatedFields };
                    }

                    renderNotes();
                    closeEditModal();
                } catch (err) {
                    console.error('failed to update note:', err.message);
                    alert('error updating note: ' + err.message);
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }
            });

            $('cancel-selection-btn')?.addEventListener('click', () => {
                selectedNoteIds.clear();
                updateMergeToolbar();
                renderNotes();
            });

            $('merge-selected-btn')?.addEventListener('click', async () => {
                if (selectedNoteIds.size < 2) return;
                await mergeSelectedNotes();
            });

            $('cancel-edit-modal-btn')?.addEventListener('click', () => closeEditModal());$('edit-note-modal')?.addEventListener('click', (e) => {
                if (e.target === $('edit-note-modal')) closeEditModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeEditModal();
            });
        }

        // --- FETCH NOTES ---
        async function fetchNotes() {
            const list = $('notes-list');
            if (!list) return;

            try {
                const snapshot = await getDocs(notesRef);
                
                globalNotesCache = snapshot.docs.map(docSnap => {
                    const data = docSnap.data();
                    return {
                        id: docSnap.id,
                        ...data
                    };
                });

                // JavaScript-side sort by created_at descending
                globalNotesCache.sort((a, b) => {
                    const timeA = parseCreatedAtTimestamp(a.created_at);
                    const timeB = parseCreatedAtTimestamp(b.created_at);
                    return timeB - timeA;
                });

                renderNotes();
            } catch (err) {
                console.error('failed to fetch notes:', err.message);
                list.innerHTML = `<div class="py-8 text-center text-xs text-red-400">error loading notes</div>`;
            }
        }

        function parseCreatedAtTimestamp(ts) {
            if (!ts) return 0;
            if (typeof ts.toDate === 'function') return ts.toDate().getTime();
            if (ts.seconds) return ts.seconds * 1000;
            const parsed = new Date(ts).getTime();
            return isNaN(parsed) ? 0 : parsed;
        }

        // --- GEMINI & LOCAL AI PROCESSING ---
        async function processNoteWithAI(userTitle, rawContent) {
            const apiKey = localStorage.getItem('gemini_key') || '';
            
            if (apiKey) {
                try {
                    const prompt = `Analyze the following raw note text and produce a structured JSON response.
Return ONLY valid JSON matching this exact schema, without markdown code fencing:
{
  "title": "A concise descriptive title (use user provided title '${userTitle}' if relevant, else summarize)",
  "summary": "A 1 to 2 sentence bulleted or clear summary of the core points",
  "tags": ["array", "of", "3-5", "lowercase", "relevant", "tags"]
}

Raw note content:
${rawContent}`;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (res.ok) {
                        const jsonRes = await res.json();
                        let text = jsonRes.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
                        
                        if (text.startsWith('```')) {
                            text = text.replace(/^```(json)?/i, '').replace(/```$/, '').trim();
                        }

                        const parsed = JSON.parse(text);
                        return {
                            title: parsed.title || userTitle || extractFallbackTitle(rawContent),
                            summary: parsed.summary || rawContent.slice(0, 150),
                            tags: Array.isArray(parsed.tags) ? parsed.tags : extractFallbackTags(rawContent)
                        };
                    }
                } catch (err) {
                    console.warn('gemini API processing failed, falling back to local parsing:', err.message);
                }
            }

            // Fallback parsing if Gemini is not configured or fails
            return {
                title: userTitle || extractFallbackTitle(rawContent),
                summary: rawContent.length > 180 ? rawContent.slice(0, 180) + '...' : rawContent,
                tags: extractFallbackTags(rawContent)
            };
        }

        function extractFallbackTitle(text) {
            const firstLine = text.trim().split('\n')[0] || 'untitled note';
            return firstLine.length > 40 ? firstLine.slice(0, 40) + '...' : firstLine;
        }

        function extractFallbackTags(text) {
            const words = text.toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
            const uniqueWords = [...new Set(words)].filter(w => !['this', 'that', 'with', 'from', 'have', 'were', 'your', 'about'].includes(w));
            return uniqueWords.slice(0, 3);
        }

        // --- MERGING FUNCTIONALITY ---
        async function mergeSelectedNotes() {
            const selectedList = globalNotesCache.filter(n => selectedNoteIds.has(n.id));
            if (selectedList.length < 2) return;

            const combinedRaw = selectedList.map(n => `--- ${n.title} ---\n${n.raw_content}`).join('\n\n');
            const defaultMergedTitle = `merged note (${selectedList.length} items)`;

            try {
                const processed = await processNoteWithAI(defaultMergedTitle, combinedRaw);
                
                const newMergedNote = {
                    title: processed.title,
                    raw_content: combinedRaw,
                    summary: processed.summary,
                    tags: processed.tags,
                    created_at: serverTimestamp()
                };

                const docRef = await addDoc(notesRef, newMergedNote);

                // Delete original merged notes
                for (const oldNote of selectedList) {
                    await deleteDoc(doc(db, 'notes', oldNote.id));
                }

                globalNotesCache = globalNotesCache.filter(n => !selectedNoteIds.has(n.id));
                globalNotesCache.unshift({
                    id: docRef.id,
                    ...newMergedNote,
                    created_at: new Date()
                });

                selectedNoteIds.clear();
                updateMergeToolbar();
                renderNotes();
            } catch (err) {
                console.error('failed to merge notes:', err.message);
                alert('error merging notes: ' + err.message);
            }
        }

        // --- RENDER NOTES & UI ---
        function renderNotes() {
            const list = $('notes-list');
            if (!list) return;

            if ($('notes-total-count')) {
                $('notes-total-count').textContent = `${globalNotesCache.length} notes`;
            }

            if (globalNotesCache.length === 0) {
                list.innerHTML = `<div class="py-8 text-center text-xs text-slate-400">no notes captured yet</div>`;
                return;
            }

            list.innerHTML = globalNotesCache.map(note => {
                const isChecked = selectedNoteIds.has(note.id);
                const createdMs = parseCreatedAtTimestamp(note.created_at);
                const dateObj = createdMs ? new Date(createdMs) : new Date();
                const formattedDate = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;

                const tagsArr = Array.isArray(note.tags) ? note.tags : [];
                const tagsHtml = tagsArr.map(t => `<span class="tag-pill">${t}</span>`).join(' ');

                return `
                    <div class="p-4 rounded-xl border border-slate-200 bg-white hover:border-slate-300 transition-all space-y-2 group">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                    onchange="window.toggleSelectNote('${note.id}')"
                                    class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer shrink-0">
                                <h3 onclick="window.openEditModal('${note.id}')" class="text-sm font-bold text-slate-900 truncate hover:text-blue-600 cursor-pointer transition-colors">
                                    ${note.title || 'untitled note'}
                                </h3>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <span class="text-[11px] text-slate-400 font-medium mr-1">${formattedDate}</span>
                                <button onclick="window.openEditModal('${note.id}')" class="text-slate-400 hover:text-blue-600 text-xs font-bold p-1 cursor-pointer transition-opacity opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="edit note">
                                    ✎
                                </button>
                                <button onclick="window.deleteNote('${note.id}')" class="text-slate-300 hover:text-red-500 text-xs font-bold p-1 cursor-pointer transition-opacity opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="delete note">
                                    ✕
                                </button>
                            </div>
                        </div>

                        ${note.summary ? `<p class="text-xs text-slate-600 leading-relaxed font-medium bg-slate-50 p-2.5 rounded-lg border border-slate-100">${note.summary}</p>` : ''}

                        <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${note.raw_content || ''}</p>

                        ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 pt-1">${tagsHtml}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateMergeToolbar() {
            const toolbar = $('merge-toolbar');
            const countText = $('selected-count-text');
            if (!toolbar || !countText) return;

            const count = selectedNoteIds.size;
            if (count > 0) {
                toolbar.classList.remove('hidden');
                countText.textContent = `${count} note${count > 1 ? 's' : ''} selected`;
            } else {
                toolbar.classList.add('hidden');
            }
        }

        // --- GLOBAL ACTIONS ---
        window.toggleSelectNote = function(id) {
            if (selectedNoteIds.has(id)) {
                selectedNoteIds.delete(id);
            } else {
                selectedNoteIds.add(id);
            }
            updateMergeToolbar();
        };

        window.deleteNote = async function(id) {
            try {
                await deleteDoc(doc(db, 'notes', id));
                globalNotesCache = globalNotesCache.filter(n => n.id !== id);
                selectedNoteIds.delete(id);
                updateMergeToolbar();
                renderNotes();
            } catch (err) {
                console.error('failed to delete note:', err.message);
                alert('error deleting note: ' + err.message);
            }
        };

        window.openEditModal = function(id) {
            const note = globalNotesCache.find(n => n.id === id);
            if (!note) return;

            $('edit-note-id').value = note.id;
            $('edit-note-title').value = note.title || '';
            $('edit-note-content').value = note.raw_content || '';
            $('edit-regenerate-ai').checked = false;

            $('edit-note-modal').classList.remove('hidden');
        };

        window.closeEditModal = function() {
            $('edit-note-modal')?.classList.add('hidden');
        };
    </script>
</body>
</html>
