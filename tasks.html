<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task manager</title>
    <!-- tailwind css cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* import inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        /* global font reset and lowercase enforcement */
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            text-transform: lowercase !important;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main) !important;
            background-image: none !important;
            font-size: 0.95rem;
            letter-spacing: normal;
            line-height: 1.5;
        }

        h1, h2, h3, h4, h5, h6, button, input, select, textarea, option, span, p, td, th {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        /* modern category badges */
        .cat-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .cat-food { background-color: #fef2f2 !important; color: #991b1b !important; }
        .cat-shopping { background-color: #eef2ff !important; color: #3730a3 !important; }
        .cat-subscriptions { background-color: #f0f9ff !important; color: #075985 !important; }
        .cat-events { background-color: #f0fdf4 !important; color: #166534 !important; }
        .cat-fees { background-color: #fffbeb !important; color: #92400e !important; }
        .cat-health { background-color: #fdf2f8 !important; color: #9d174d !important; }
        .cat-transport { background-color: #ecfeff !important; color: #155e75 !important; }
        .cat-default { background-color: #f1f5f9 !important; color: #334155 !important; }

        /* card container */
        .glass-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05) !important;
            border-radius: 12px !important;
        }

        /* inputs & interactive elements */
        input, select, textarea {
            background-color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            font-size: 0.875rem !important;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER / NAV -->
    <header class="glass-card sticky top-0 z-20 mx-4 mt-4">
        <div class="max-w-2xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">task manager</h1>
            <div class="flex gap-2">
                <a href="index.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">expenses</a>
                <a href="tasks.html" class="px-3.5 py-1.5 bg-blue-50 text-blue-600 text-sm font-semibold rounded-lg">tasks</a>
                <a href="notes.html" class="px-3.5 py-1.5 text-slate-600 hover:text-slate-900 text-sm font-semibold rounded-lg transition-colors">notes</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 pt-6 space-y-6">

        <!-- TASK STATS & SUMMARY PILLS -->
        <div class="glass-card p-4 flex justify-between items-center gap-2">
            <div class="flex gap-2 flex-wrap">
                <span class="text-xs font-semibold bg-slate-100 text-slate-700 px-3 py-1 rounded-full">
                    total: <strong id="stat-total-count" class="text-slate-900">0</strong>
                </span>
                <span class="text-xs font-semibold bg-amber-50 text-amber-700 px-3 py-1 rounded-full">
                    pending: <strong id="stat-pending-count" class="text-amber-800">0</strong>
                </span>
                <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full">
                    completed: <strong id="stat-completed-count" class="text-emerald-800">0</strong>
                </span>
            </div>
            <button id="clear-completed-btn" class="text-xs font-semibold text-slate-400 hover:text-red-500 transition-colors cursor-pointer hidden">
                clear completed
            </button>
        </div>

        <!-- ADD NEW TASK FORM -->
        <div class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-semibold text-slate-500 tracking-wider">add new task</h2>
            <form id="task-form" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="task-input" placeholder="what needs to be done?" required class="sm:col-span-2 px-3.5 py-2">
                    <select id="task-category" class="px-3.5 py-2">
                        <option value="general">general</option>
                        <option value="food & drink">food & drink</option>
                        <option value="shopping">shopping</option>
                        <option value="subscriptions">subscriptions</option>
                        <option value="events">events</option>
                        <option value="fees">fees</option>
                        <option value="health">health</option>
                        <option value="transport">transport</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">
                    add task
                </button>
            </form>
        </div>

        <!-- FILTERS & TASK LIST -->
        <div class="glass-card p-6 space-y-4">
            <!-- Filter Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                <!-- Status Tabs -->
                <div class="flex gap-1 bg-slate-100 p-1 rounded-lg text-xs font-semibold">
                    <button id="tab-all" onclick="window.setFilterStatus('all')" class="px-3 py-1 rounded-md bg-white text-slate-900 shadow-xs cursor-pointer">all</button>
                    <button id="tab-pending" onclick="window.setFilterStatus('pending')" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-900 cursor-pointer">pending</button>
                    <button id="tab-completed" onclick="window.setFilterStatus('completed')" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-900 cursor-pointer">completed</button>
                </div>

                <!-- Category Filter -->
                <select id="category-filter-select" class="px-3 py-1 text-xs font-semibold cursor-pointer w-full sm:w-auto">
                    <option value="all">all categories</option>
                    <option value="general">general</option>
                    <option value="food & drink">food & drink</option>
                    <option value="shopping">shopping</option>
                    <option value="subscriptions">subscriptions</option>
                    <option value="events">events</option>
                    <option value="fees">fees</option>
                    <option value="health">health</option>
                    <option value="transport">transport</option>
                </select>
            </div>

            <!-- Task List Container -->
            <ul id="task-list" class="divide-y divide-slate-100">
                <li class="py-6 text-center text-xs text-slate-400">loading tasks...</li>
            </ul>
        </div>

    </main>

    <!-- EDIT TASK MODAL -->
    <div id="edit-task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md p-6 space-y-4 bg-white">
            <h3 class="text-base font-bold text-slate-900">edit task</h3>
            <form id="edit-task-form" class="space-y-3">
                <input type="hidden" id="edit-task-id">
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">task description</label>
                    <input type="text" id="edit-task-title" required class="w-full px-3.5 py-2">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 tracking-wider block mb-1">category</label>
                    <select id="edit-task-category" class="w-full px-3.5 py-2">
                        <option value="general">general</option>
                        <option value="food & drink">food & drink</option>
                        <option value="shopping">shopping</option>
                        <option value="subscriptions">subscriptions</option>
                        <option value="events">events</option>
                        <option value="fees">fees</option>
                        <option value="health">health</option>
                        <option value="transport">transport</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-edit-task-btn" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition-all cursor-pointer">cancel</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-all cursor-pointer">save changes</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { APP_CONFIG } from './config.js';

        // --- FIREBASE INITIALIZATION ---
        const app = initializeApp(APP_CONFIG.FIREBASE_CONFIG);
        const db = getFirestore(app);
        const todosRef = collection(db, 'todos');

        // --- DOM HELPER ---
        const $ = (id) => document.getElementById(id);

        // --- GLOBAL STATE ---
        let globalTasksCache = [];
        let activeStatusFilter = 'all';
        let activeCategoryFilter = 'all';

        // --- CATEGORY BADGE STYLES ---
        const CATEGORY_STYLES = {
            'food & drink': 'cat-food',
            'shopping': 'cat-shopping',
            'subscriptions': 'cat-subscriptions',
            'events': 'cat-events',
            'fees': 'cat-fees',
            'health': 'cat-health',
            'transport': 'cat-transport',
            'general': 'cat-default'
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchTasks();
        });

        function setupEventListeners() {
            // Add Task
            $('task-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = $('task-input');
                const categorySelect = $('task-category');
                
                const title = input.value.trim().toLowerCase();
                const category = (categorySelect?.value || 'general').toLowerCase();

                if (!title) return;

                try {
                    const newTaskObj = {
                        title,
                        is_complete: false,
                        category,
                        created_at: serverTimestamp()
                    };
                    
                    const docRef = await addDoc(todosRef, newTaskObj);
                    
                    globalTasksCache.unshift({
                        id: docRef.id,
                        ...newTaskObj,
                        created_at: new Date()
                    });

                    input.value = '';
                    renderTasks();
                } catch (err) {
                    console.error('failed to add task:', err.message);
                }
            });

            // Edit Task Submission
            $('edit-task-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = $('edit-task-id').value;
                const title = $('edit-task-title').value.trim().toLowerCase();
                const category = $('edit-task-category').value.toLowerCase();

                if (!title || !id) return;

                try {
                    const updateObj = { title, category };
                    await updateDoc(doc(db, 'todos', id), updateObj);

                    const index = globalTasksCache.findIndex(t => t.id === id);
                    if (index !== -1) {
                        globalTasksCache[index].title = title;
                        globalTasksCache[index].category = category;
                    }

                    renderTasks();
                    closeTaskModal();
                } catch (err) {
                    console.error('failed to update task:', err.message);
                }
            });

            // Category Filter Dropdown
            $('category-filter-select')?.addEventListener('change', (e) => {
                activeCategoryFilter = e.target.value.toLowerCase();
                renderTasks();
            });

            // Clear Completed Tasks
            $('clear-completed-btn')?.addEventListener('click', async () => {
                const completedTasks = globalTasksCache.filter(t => t.is_complete);
                if (completedTasks.length === 0) return;

                try {
                    for (const task of completedTasks) {
                        await deleteDoc(doc(db, 'todos', task.id));
                    }

                    globalTasksCache = globalTasksCache.filter(t => !t.is_complete);
                    renderTasks();
                } catch (err) {
                    console.error('failed to clear completed tasks:', err.message);
                }
            });

            // Close Edit Modal Handlers
            $('cancel-edit-task-btn')?.addEventListener('click', () => closeTaskModal());
            
            $('edit-task-modal')?.addEventListener('click', (e) => {
                if (e.target === $('edit-task-modal')) closeTaskModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeTaskModal();
            });
        }

        // --- FETCH TASKS ---
        async function fetchTasks() {
            const list = $('task-list');
            if (!list) return;

            try {
                const snapshot = await getDocs(todosRef);

                globalTasksCache = snapshot.docs.map(docSnap => {
                    return {
                        id: docSnap.id,
                        ...docSnap.data()
                    };
                });

                // JavaScript-side sort by created_at descending
                globalTasksCache.sort((a, b) => {
                    const timeA = parseCreatedAtTimestamp(a.created_at);
                    const timeB = parseCreatedAtTimestamp(b.created_at);
                    return timeB - timeA;
                });

                renderTasks();
            } catch (err) {
                console.error('failed to fetch tasks:', err.message);
                list.innerHTML = `<li class="py-6 text-center text-xs text-red-400">error loading tasks</li>`;
            }
        }

        function parseCreatedAtTimestamp(ts) {
            if (!ts) return 0;
            if (typeof ts.toDate === 'function') return ts.toDate().getTime();
            if (ts.seconds) return ts.seconds * 1000;
            const parsed = new Date(ts).getTime();
            return isNaN(parsed) ? 0 : parsed;
        }

        // --- RENDER TASKS & STATS ---
        function renderTasks() {
            const list = $('task-list');
            if (!list) return;

            const totalCount = globalTasksCache.length;
            const completedCount = globalTasksCache.filter(t => t.is_complete).length;
            const pendingCount = totalCount - completedCount;

            if ($('stat-total-count')) $('stat-total-count').textContent = totalCount;
            if ($('stat-pending-count')) $('stat-pending-count').textContent = pendingCount;
            if ($('stat-completed-count')) $('stat-completed-count').textContent = completedCount;

            const clearBtn = $('clear-completed-btn');
            if (clearBtn) {
                if (completedCount > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }

            const filtered = globalTasksCache.filter(task => {
                const matchesStatus = 
                    activeStatusFilter === 'all' ||
                    (activeStatusFilter === 'pending' && !task.is_complete) ||
                    (activeStatusFilter === 'completed' && task.is_complete);

                const taskCat = (task.category || 'general').toLowerCase();
                const matchesCategory = activeCategoryFilter === 'all' || taskCat === activeCategoryFilter;

                return matchesStatus && matchesCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<li class="py-8 text-center text-xs text-slate-400">no tasks found</li>`;
                return;
            }

            list.innerHTML = filtered.map(todo => {
                const createdMs = parseCreatedAtTimestamp(todo.created_at);
                const dateObj = createdMs ? new Date(createdMs) : new Date();
                const formattedDate = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                
                const catKey = (todo.category || 'general').toLowerCase();
                const badgeClass = CATEGORY_STYLES[catKey] || 'cat-default';

                return `
                    <li class="py-3 flex items-center justify-between gap-3 group transition-colors">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <input type="checkbox" ${todo.is_complete ? 'checked' : ''} 
                                onchange="window.toggleTask('${todo.id}', ${!todo.is_complete})"
                                class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer shrink-0">
                            <span class="cat-badge ${badgeClass} shrink-0">${todo.category || 'general'}</span>
                            <span onclick="window.openTaskModal('${todo.id}')" title="click to edit" class="text-xs font-semibold truncate hover:text-blue-600 cursor-pointer transition-colors ${todo.is_complete ? 'line-through text-slate-300' : 'text-slate-800'}">
                                ${todo.title}
                            </span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[11px] text-slate-400 font-medium mr-1">${formattedDate}</span>
                            <button onclick="window.openTaskModal('${todo.id}')" class="text-slate-400 hover:text-blue-600 text-xs font-bold p-1 cursor-pointer transition-opacity opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="edit task">
                                ✎
                            </button>
                            <button onclick="window.deleteTask('${todo.id}')" class="text-slate-300 hover:text-red-500 text-xs font-bold p-1 cursor-pointer transition-opacity opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="delete task">
                                ✕
                            </button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        // --- FILTER STATUS TOGGLE ---
        window.setFilterStatus = function(status) {
            activeStatusFilter = status;
            
            ['all', 'pending', 'completed'].forEach(s => {
                const btn = $(`tab-${s}`);
                if (btn) {
                    if (s === status) {
                        btn.className = "px-3.5 py-1 rounded-md bg-white text-slate-900 shadow-xs cursor-pointer";
                    } else {
                        btn.className = "px-3.5 py-1 rounded-md text-slate-500 hover:text-slate-900 cursor-pointer";
                    }
                }
            });

            renderTasks();
        };

        // --- TASK ACTIONS ---
        window.toggleTask = async function(id, is_complete) {
            try {
                await updateDoc(doc(db, 'todos', id), { is_complete });

                const index = globalTasksCache.findIndex(t => t.id === id);
                if (index !== -1) {
                    globalTasksCache[index].is_complete = is_complete;
                }

                renderTasks();
            } catch (err) {
                console.error('failed to update task:', err.message);
            }
        };

        window.deleteTask = async function(id) {
            try {
                await deleteDoc(doc(db, 'todos', id));

                globalTasksCache = globalTasksCache.filter(t => t.id !== id);
                renderTasks();
            } catch (err) {
                console.error('failed to delete task:', err.message);
            }
        };

        // --- MODAL CONTROLS ---
        window.openTaskModal = function(id) {
            const task = globalTasksCache.find(t => t.id === id);
            if (!task) return;

            $('edit-task-id').value = task.id;
            $('edit-task-title').value = task.title || '';
            $('edit-task-category').value = (task.category || 'general').toLowerCase();

            $('edit-task-modal').classList.remove('hidden');
        };

        window.closeTaskModal = function() {
            $('edit-task-modal')?.classList.add('hidden');
        };
    </script>
</body>
</html>
